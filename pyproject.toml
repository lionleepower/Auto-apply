[project]
name = "autofill"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "leyan li", email = "leyanpower@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openai>=3.26.0",
    "openpyxl>=3.1.5",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
autofill = "autofill:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
