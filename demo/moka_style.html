<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Demo · 复杂控件网申表单（日期面板 / 级联 / 远程搜索）</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; background: #f4f5f7; margin: 0; }
  .page { max-width: 760px; margin: 24px auto; background: #fff; padding: 24px 32px; border-radius: 8px; }
  h3.form-title { margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #00b38a; }
  .block { border: 1px dashed #ddd; padding: 6px 12px; margin-bottom: 10px; }
  .ant-form-item { display: flex; margin: 10px 0; }
  .ant-form-item-label { width: 130px; flex: none; }
  .ant-form-item-control { flex: 1; }
  .ant-input { width: 100%; box-sizing: border-box; padding: 5px 8px; border: 1px solid #d9d9d9; border-radius: 4px; font: inherit; }
  .ant-picker, .ant-select, .el-date-editor { display: flex; gap: 6px; align-items: center; border: 1px solid #d9d9d9; border-radius: 4px; padding: 4px 8px; cursor: pointer; min-height: 24px; }
  .ant-picker input, .el-date-editor input, .ant-select input { border: 0; outline: 0; flex: 1; font: inherit; min-width: 0; background: transparent; }
  .ant-select-selection-placeholder { color: #aaa; }
  .dd { position: absolute; z-index: 1000; background: #fff; border: 1px solid #ddd; box-shadow: 0 6px 16px rgba(0,0,0,.12); padding: 6px; }
  .ant-picker-panels { display: flex; gap: 12px; }
  .ant-picker-header, .el-date-picker__header { display: flex; align-items: center; gap: 4px; padding: 4px; border-bottom: 1px solid #eee; }
  .ant-picker-header-view, .el-date-picker__header-label { flex: 1; text-align: center; }
  .ant-picker-header button, .el-date-picker__header button { border: 0; background: #f2f2f2; min-width: 22px; height: 22px; cursor: pointer; }
  .ant-picker-content td, .el-month-table td { padding: 4px 6px; text-align: center; cursor: pointer; }
  .ant-picker-cell:not(.ant-picker-cell-in-view) { color: #ccc; }
  .ant-cascader-menus { display: flex; }
  .ant-cascader-menu { list-style: none; margin: 0; padding: 0; min-width: 110px; border-right: 1px solid #eee; }
  .ant-cascader-menu-item, .ant-select-item-option { padding: 4px 10px; cursor: pointer; }
  .ant-cascader-menu-item:hover, .ant-select-item-option:hover { background: #e6fff7; }
  .add { color: #00b38a; cursor: pointer; }
</style>
</head>
<body>
<div class="page">
  <h2>示例科技 2027 校招 · 网申（复杂控件 Demo）</h2>

  <h3 class="form-title">基本信息</h3>
  <div class="ant-form-item"><div class="ant-form-item-label"><label>姓名</label></div>
    <div class="ant-form-item-control"><input class="ant-input" data-key="name"></div></div>
  <div class="ant-form-item"><div class="ant-form-item-label"><label>出生日期</label></div>
    <div class="ant-form-item-control"><div class="ant-picker" data-key="birth" data-mode="date">
      <div class="ant-picker-input"><input readonly placeholder="请选择日期"></div></div></div></div>
  <div class="ant-form-item"><div class="ant-form-item-label"><label>籍贯</label></div>
    <div class="ant-form-item-control"><div class="ant-select ant-cascader" data-key="hometown">
      <div class="ant-select-selector"><span class="ant-select-selection-placeholder">请选择省/市</span></div></div></div></div>
  <div class="ant-form-item"><div class="ant-form-item-label"><label>期望工作地点</label></div>
    <div class="ant-form-item-control"><div class="ant-select ant-cascader" data-key="exp_city">
      <div class="ant-select-selector"><span class="ant-select-selection-placeholder">请选择</span></div></div></div></div>

  <h3 class="form-title">教育经历</h3>
  <div id="edu-list">
    <div class="block">
      <div class="ant-form-item"><div class="ant-form-item-label"><label>学校</label></div>
        <div class="ant-form-item-control"><div class="ant-select ant-select-show-search" data-f="school" data-source="schools">
          <div class="ant-select-selector"><span class="ant-select-selection-search"><input class="ant-select-selection-search-input" autocomplete="off"></span>
          <span class="ant-select-selection-placeholder">输入学校名称搜索</span></div></div></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label>学历</label></div>
        <div class="ant-form-item-control"><div class="ant-select" data-f="degree" data-options="本科,硕士,博士">
          <div class="ant-select-selector"><span class="ant-select-selection-placeholder">请选择</span></div></div></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label>专业</label></div>
        <div class="ant-form-item-control"><input class="ant-input" data-f="major"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label>在校时间</label></div>
        <div class="ant-form-item-control"><div class="ant-picker ant-picker-range" data-f="period" data-mode="month">
          <div class="ant-picker-input"><input readonly placeholder="开始月份"></div><span>→</span>
          <div class="ant-picker-input"><input readonly placeholder="结束月份"></div></div></div></div>
    </div>
  </div>
  <span class="add">+ 添加教育经历</span>

  <h3 class="form-title">实习经历</h3>
  <div id="work-list">
    <div class="block">
      <div class="ant-form-item"><div class="ant-form-item-label"><label>公司名称</label></div>
        <div class="ant-form-item-control"><input class="ant-input" data-f="company"></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label>开始时间</label></div>
        <div class="ant-form-item-control"><div class="el-date-editor el-input" data-f="start">
          <input class="el-input__inner" readonly placeholder="选择月份"></div></div></div>
      <div class="ant-form-item"><div class="ant-form-item-label"><label>结束时间</label></div>
        <div class="ant-form-item-control"><div class="ant-picker" data-f="end" data-mode="month">
          <div class="ant-picker-input"><input placeholder="请选择结束月份"></div></div></div></div>
    </div>
  </div>
  <span class="add">+ 添加实习经历</span>

  <div style="margin-top:24px"><button id="submit" type="button">投递简历</button></div>
</div>

<script>
  window.__submitted = false;
  document.getElementById('submit').onclick = () => { window.__submitted = true; };
  const pad = (n) => String(n).padStart(2, '0');
  const today = new Date();
  const REGIONS = { '北京市': ['北京市'], '上海市': ['上海市'], '江苏省': ['南京市', '苏州市', '无锡市'], '浙江省': ['杭州市', '宁波市'], '安徽省': ['合肥市', '芜湖市'] };
  const SCHOOLS = ['示例大学', '示例大学附属学院', '示例理工大学', '示例师范大学', '另一所大学'];
  const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];

  // ---- 弹层管理 ----
  let dd = null;
  function closeDD() { if (dd) { dd.el.remove(); dd = null; } }
  function openDD(owner, cls) {
    closeDD();
    const r = owner.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'dd ' + cls;
    el.style.left = (r.left + scrollX) + 'px';
    el.style.top = (r.bottom + scrollY + 2) + 'px';
    document.body.appendChild(el);
    dd = { el, owner };
    return el;
  }
  function btn(cls, text, fn) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = cls; b.textContent = text;
    b.addEventListener('click', fn);
    return b;
  }
  function setSelectText(root, text) {
    root.querySelector('.ant-select-selection-placeholder')?.remove();
    let s = root.querySelector('.ant-select-selection-item');
    if (!s) { s = document.createElement('span'); s.className = 'ant-select-selection-item'; root.querySelector('.ant-select-selector').appendChild(s); }
    s.textContent = text;
  }

  // ---- Ant Design 风格 DatePicker（date / month；input 可只读） ----
  function openAntPicker(root) {
    const mode = root.dataset.mode;
    const cur = (root.dataset.value || '').split('-').map(Number);
    const st = { y: cur[0] || today.getFullYear(), m: cur[1] || today.getMonth() + 1 };
    const el = openDD(root, 'ant-picker-dropdown');
    const commit = (v) => { root.dataset.value = v; root.querySelector('input').value = v; closeDD(); };
    function render() {
      el.innerHTML = '';
      const panel = document.createElement('div'); panel.className = 'ant-picker-panel';
      const h = document.createElement('div'); h.className = 'ant-picker-header';
      const move = (dm) => () => { const t = st.y * 12 + st.m - 1 + dm; st.y = Math.floor(t / 12); st.m = t % 12 + 1; render(); };
      h.appendChild(btn('ant-picker-header-super-prev-btn', '«', move(-12)));
      if (mode === 'date') h.appendChild(btn('ant-picker-header-prev-btn', '‹', move(-1)));
      const view = document.createElement('div'); view.className = 'ant-picker-header-view';
      view.appendChild(btn('ant-picker-year-btn', st.y + '年', () => {}));
      if (mode === 'date') view.appendChild(btn('ant-picker-month-btn', st.m + '月', () => {}));
      h.appendChild(view);
      if (mode === 'date') h.appendChild(btn('ant-picker-header-next-btn', '›', move(1)));
      h.appendChild(btn('ant-picker-header-super-next-btn', '»', move(12)));
      panel.appendChild(h);
      const table = document.createElement('table'); table.className = 'ant-picker-content';
      const cell = (text, inView, fn) => {
        const td = document.createElement('td');
        td.className = 'ant-picker-cell' + (inView ? ' ant-picker-cell-in-view' : '');
        td.innerHTML = '<div class="ant-picker-cell-inner"></div>';
        td.firstChild.textContent = text;
        td.addEventListener('click', fn);
        return td;
      };
      if (mode === 'month') {
        for (let r = 0; r < 4; r++) {
          const tr = table.insertRow();
          for (let c = 0; c < 3; c++) { const k = r * 3 + c + 1; tr.appendChild(cell(k + '月', true, () => commit(`${st.y}-${pad(k)}`))); }
        }
      } else {
        const first = new Date(st.y, st.m - 1, 1);
        const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
        for (let r = 0; r < 6; r++) {
          const tr = table.insertRow();
          for (let c = 0; c < 7; c++) {
            const d = new Date(start); d.setDate(start.getDate() + r * 7 + c);
            const v = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
            tr.appendChild(cell(String(d.getDate()), d.getMonth() === st.m - 1, () => commit(v)));
          }
        }
      }
      panel.appendChild(table);
      el.appendChild(panel);
    }
    render();
  }

  // ---- Ant Design 风格 RangePicker（month，两个只读 input，左右两块面板）----
  function openRange(root, active) {
    const inputs = root.querySelectorAll('input');
    const st = { y: today.getFullYear() - 1, active };
    const el = openDD(root, 'ant-picker-dropdown ant-picker-dropdown-range');
    dd.setActive = (k) => { st.active = k; };
    function render() {
      el.innerHTML = '';
      const panels = document.createElement('div'); panels.className = 'ant-picker-panels';
      [0, 1].forEach((p) => {
        const panel = document.createElement('div'); panel.className = 'ant-picker-panel';
        const h = document.createElement('div'); h.className = 'ant-picker-header';
        if (p === 0) h.appendChild(btn('ant-picker-header-super-prev-btn', '«', () => { st.y--; render(); }));
        const view = document.createElement('div'); view.className = 'ant-picker-header-view';
        view.appendChild(btn('ant-picker-year-btn', (st.y + p) + '年', () => {}));
        h.appendChild(view);
        if (p === 1) h.appendChild(btn('ant-picker-header-super-next-btn', '»', () => { st.y++; render(); }));
        panel.appendChild(h);
        const table = document.createElement('table'); table.className = 'ant-picker-content';
        for (let r = 0; r < 4; r++) {
          const tr = table.insertRow();
          for (let c = 0; c < 3; c++) {
            const k = r * 3 + c + 1;
            const td = document.createElement('td'); td.className = 'ant-picker-cell ant-picker-cell-in-view';
            td.innerHTML = '<div class="ant-picker-cell-inner"></div>'; td.firstChild.textContent = k + '月';
            td.addEventListener('click', () => {
              inputs[st.active].value = `${st.y + p}-${pad(k)}`;
              if (st.active === 0) { st.active = 1; render(); } else closeDD();
            });
            tr.appendChild(td);
          }
        }
        panel.appendChild(table);
        panels.appendChild(panel);
      });
      el.appendChild(panels);
    }
    render();
  }

  // ---- Element 风格月份选择（中文月份、d-arrow 图标按钮）----
  function openElMonth(root) {
    const st = { y: today.getFullYear() };
    const el = openDD(root, 'el-picker-panel el-date-picker');
    function render() {
      el.innerHTML = '';
      const h = document.createElement('div'); h.className = 'el-date-picker__header';
      h.appendChild(btn('el-picker-panel__icon-btn el-icon-d-arrow-left', '', () => { st.y--; render(); }));
      const label = document.createElement('span'); label.className = 'el-date-picker__header-label'; label.textContent = st.y + ' 年';
      h.appendChild(label);
      h.appendChild(btn('el-picker-panel__icon-btn el-icon-d-arrow-right', '', () => { st.y++; render(); }));
      el.appendChild(h);
      const table = document.createElement('table'); table.className = 'el-month-table';
      for (let r = 0; r < 3; r++) {
        const tr = table.insertRow();
        for (let c = 0; c < 4; c++) {
          const k = r * 4 + c + 1;
          const td = document.createElement('td');
          td.innerHTML = '<div><a class="cell"></a></div>'; td.querySelector('a').textContent = CN[k - 1] + '月';
          td.addEventListener('click', () => { root.dataset.value = `${st.y}-${pad(k)}`; root.querySelector('input').value = root.dataset.value; closeDD(); });
          tr.appendChild(td);
        }
      }
      el.appendChild(table);
    }
    render();
  }

  // ---- 级联选择（省 → 市）----
  function openCascader(root) {
    const path = [];
    const el = openDD(root, 'ant-select-dropdown ant-cascader-dropdown');
    function render() {
      el.innerHTML = '<div class="ant-cascader-menus"></div>';
      const menus = el.firstChild;
      const cols = [Object.keys(REGIONS)];
      if (path[0]) cols.push(REGIONS[path[0]]);
      cols.forEach((items, level) => {
        const ul = document.createElement('ul'); ul.className = 'ant-cascader-menu';
        items.forEach((name) => {
          const li = document.createElement('li'); li.className = 'ant-cascader-menu-item';
          li.innerHTML = '<div class="ant-cascader-menu-item-content"></div>'; li.firstChild.textContent = name;
          li.addEventListener('click', () => {
            path.length = level; path.push(name);
            if (level === 0) render();
            else { root.dataset.value = path.join('/'); setSelectText(root, path.join(' / ')); closeDD(); }
          });
          ul.appendChild(li);
        });
        menus.appendChild(ul);
      });
    }
    render();
  }

  // ---- 普通下拉与远程搜索下拉 ----
  function openSelect(root, query) {
    const el = (dd && dd.owner === root) ? dd.el : openDD(root, 'ant-select-dropdown');
    el.innerHTML = '';
    let opts = root.dataset.options ? root.dataset.options.split(',') : [];
    if (root.dataset.source === 'schools') opts = query ? SCHOOLS.filter((s) => s.includes(query)) : [];
    if (!opts.length) { el.innerHTML = '<div class="ant-select-item-empty">请输入关键词搜索</div>'; return; }
    opts.forEach((o) => {
      const it = document.createElement('div'); it.className = 'ant-select-item ant-select-item-option';
      it.innerHTML = '<div class="ant-select-item-option-content"></div>'; it.firstChild.textContent = o;
      it.addEventListener('click', () => {
        root.dataset.value = o; setSelectText(root, o);
        const inp = root.querySelector('input'); if (inp) inp.value = '';
        closeDD();
      });
      el.appendChild(it);
    });
  }
  let searchTimer = null;
  document.addEventListener('input', (e) => {
    const root = e.target.closest('.ant-select-show-search');
    if (!root) return;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => openSelect(root, e.target.value.trim()), 300); // 模拟远程搜索延迟
  });

  // ---- 打开/关闭 ----
  document.addEventListener('mousedown', (e) => {
    if (dd && dd.el.contains(e.target)) return;
    const range = e.target.closest('.ant-picker-range');
    const picker = e.target.closest('.ant-picker');
    const elp = e.target.closest('.el-date-editor');
    const cas = e.target.closest('.ant-cascader');
    const sel = e.target.closest('.ant-select');
    if (range) {
      const k = Math.max(0, [...range.querySelectorAll('input')].indexOf(e.target.closest('input')));
      if (dd && dd.owner === range) dd.setActive(k); else openRange(range, k);
    } else if (picker) { if (!dd || dd.owner !== picker) openAntPicker(picker); }
    else if (elp) { if (!dd || dd.owner !== elp) openElMonth(elp); }
    else if (cas) { if (!dd || dd.owner !== cas) openCascader(cas); }
    else if (sel) { if (!dd || dd.owner !== sel) openSelect(sel, ''); }
    else closeDD();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeDD(); return; }
    // AntD：可输入的 picker 输入合法日期后回车才生效
    const picker = e.target.closest && e.target.closest('.ant-picker:not(.ant-picker-range)');
    if (e.key === 'Enter' && picker && !e.target.readOnly) {
      const ok = picker.dataset.mode === 'month' ? /^\d{4}-\d{2}$/ : /^\d{4}-\d{2}-\d{2}$/;
      if (ok.test(e.target.value)) { picker.dataset.value = e.target.value; closeDD(); }
    }
  });
  // 失焦时未回车确认的输入会被丢弃（与 AntD 行为一致）
  document.addEventListener('focusout', (e) => {
    const picker = e.target.closest && e.target.closest('.ant-picker:not(.ant-picker-range)');
    if (picker && !e.target.readOnly) e.target.value = picker.dataset.value || '';
  });

  // ---- 可重复段落 ----
  document.querySelectorAll('.add').forEach((a) => a.addEventListener('click', () => {
    const list = a.previousElementSibling;
    const c = list.firstElementChild.cloneNode(true);
    c.querySelectorAll('input').forEach((i) => { i.value = ''; });
    c.querySelectorAll('[data-value]').forEach((x) => { delete x.dataset.value; });
    c.querySelectorAll('.ant-select-selection-item').forEach((x) => x.remove());
    list.appendChild(c);
  }));

  // ---- 测试用 ----
  function val(el) {
    if (el.classList.contains('ant-picker-range')) {
      const [a, b] = el.querySelectorAll('input');
      return a.value || b.value ? `${a.value}~${b.value}` : '';
    }
    return el.dataset.value || (el.tagName === 'INPUT' ? el.value : '');
  }
  window.__formValues = () => {
    const out = {};
    document.querySelectorAll('[data-key]').forEach((el) => { out[el.dataset.key] = val(el); });
    [['edu-list', 'edu'], ['work-list', 'work']].forEach(([id, p]) => {
      [...document.getElementById(id).children].forEach((b, i) => {
        b.querySelectorAll('[data-f]').forEach((el) => { out[`${p}.${i}.${el.dataset.f}`] = val(el); });
      });
    });
    out.__submitted = window.__submitted;
    return out;
  };
</script>
</body>
</html>
