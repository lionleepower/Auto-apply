<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Demo · Moka sd- 组件结构复刻（众安保险，2026-10-09 诊断）</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; background: #f4f5f7; margin: 0; }
  .page { max-width: 760px; margin: 24px auto; background: #fff; padding: 24px 32px; border-radius: 8px; }
  .sec-h { font-size: 18px; font-weight: 600; margin: 22px 0 10px; }
  .item-row { margin: 12px 0; }
  .item-row > .cap { color: #555; font-size: 13px; margin-bottom: 3px; }
  input[type=text] { box-sizing: border-box; padding: 5px 8px; border: 1px solid #d9d9d9; border-radius: 4px; font: inherit; }
  .full { width: 100%; }
  .month-range, .month-range-select { display: flex; gap: 8px; align-items: center; }
  .item-half { width: 120px; }
  .sd-Select-container { position: relative; display: block; border: 1px solid #d9d9d9; border-radius: 4px; cursor: pointer; padding: 3px 6px; min-height: 26px; }
  .sd-Select-container input { border: 0; outline: 0; width: 100%; cursor: pointer; background: transparent; padding: 0; }
  .sd-Input-display-value { position: absolute; left: 6px; top: 3px; pointer-events: none; }
  .sd-Dropdown-dropdown { position: absolute; z-index: 20; background: #fff; border: 1px solid #ddd; box-shadow: 0 6px 16px rgba(0,0,0,.12); min-width: 120px; }
  .sd-Select-scrollable { max-height: 220px; overflow-y: auto; }
  .sd-Menu-content-item { padding: 4px 12px; cursor: pointer; }
  .sd-Menu-content-item:hover { background: #eef3ff; }
  .sd-panal-menu-wrapper { width: 260px; padding: 8px; }
  .sd-basic-selector { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .sd-Icon-container { display: inline-block; width: 22px; height: 22px; background: #eee; border-radius: 3px; cursor: pointer; text-align: center; line-height: 22px; }
  .sd-basic-year-row, .sd-basic-day-row { display: flex; gap: 4px; margin-bottom: 4px; }
  .sd-basic-year-wrapper { flex: 1; text-align: center; }
  .sd-basic-year-item, .sd-basic-day-item { padding: 3px 0; cursor: pointer; border-radius: 3px; }
  .sd-basic-year-item:hover, .sd-basic-day-item:hover { background: #eef3ff; }
  .sd-basic-day-cell { width: 14.28%; text-align: center; }
</style>
</head>
<body>
<div class="page">
  <h2>众安保险 2027 校招（Moka · sd 组件）</h2>

  <div class="sec"><h3 class="sec-h">个人信息</h3>
  <div class="item-row"><input type="text" class="full" placeholder="姓名" data-key="name"></div>
  <div class="item-row"><input type="text" class="full" readonly placeholder="出生日期 (年龄)" data-key="birth" id="birth"></div>
  <div class="item-row"><div class="cap">毕业时间</div>
    <div class="month-range date_info" data-key="grad">
      <div class="item-half"><label class="sd-Input-container sd-Select-container"><span class="sd-Input-display-value"></span><input type="text" placeholder="年" autocomplete="off" data-kind="year"></label></div>
      <div class="item-half"><label class="sd-Input-container sd-Select-container"><span class="sd-Input-display-value"></span><input type="text" placeholder="月" autocomplete="off" data-kind="month"></label></div>
    </div></div>

  </div><div class="sec"><h3 class="sec-h">教育背景</h3>
  <div class="item-row"><div class="cap">就读时间</div>
    <div class="month-range-select date_info" data-key="period">
      <div class="item-half"><label class="sd-Input-container sd-Select-container"><span class="sd-Input-display-value"></span><input type="text" placeholder="年" autocomplete="off" data-kind="year"></label></div>
      <div class="item-half"><label class="sd-Input-container sd-Select-container"><span class="sd-Input-display-value"></span><input type="text" placeholder="月" autocomplete="off" data-kind="month"></label></div>
      <span>至</span>
      <div class="item-half"><label class="sd-Input-container sd-Select-container"><span class="sd-Input-display-value"></span><input type="text" placeholder="年" autocomplete="off" data-kind="year"></label></div>
      <div class="item-half"><label class="sd-Input-container sd-Select-container"><span class="sd-Input-display-value"></span><input type="text" placeholder="月" autocomplete="off" data-kind="month"></label></div>
    </div></div>
  <div class="item-row"><input type="text" class="full" placeholder="请输入就读学校" data-key="school"></div>
  <div class="item-row"><input type="text" class="full" placeholder="请输入专业名称" data-key="major"></div>

  </div>
  <button type="button" id="submit">提交</button>
</div>
<script>
  // ---- 年 / 月下拉：弹层只创建一次，反复显示 / 隐藏 ----
  let dd = null, owner = null;
  const years = []; for (let y = 2126; y >= 1980; y--) years.push(String(y));
  const months = []; for (let m = 1; m <= 12; m++) months.push(m + '月');
  function ensure() {
    if (dd) return dd;
    dd = document.createElement('div');
    dd.className = 'sd-Dropdown-dropdown';
    document.body.appendChild(dd);
    return dd;
  }
  function closeDd() { if (dd) dd.style.display = 'none'; owner = null; }
  document.querySelectorAll('.sd-Select-container').forEach((lab) => {
    const inp = lab.querySelector('input');
    lab.addEventListener('click', (e) => {
      e.stopPropagation();
      if (owner === lab) return closeDd();
      const d = ensure();
      const opts = inp.dataset.kind === 'year' ? years : months;
      d.innerHTML = '<div class="sd-Select-menu"><div class="sd-Select-scrollable"></div></div>';
      const box = d.querySelector('.sd-Select-scrollable');
      opts.forEach((t) => {
        const c = document.createElement('div');
        c.className = 'sd-Menu-container';
        c.innerHTML = '<div class="sd-Menu-content sd-Menu-leftItem"><div class="sd-Menu-content-item"><span data-key="sugar.select.label"></span></div></div>';
        c.querySelector('span').textContent = t;
        c.querySelector('.sd-Menu-content-item').addEventListener('click', (ev) => {
          ev.stopPropagation();
          lab.querySelector('.sd-Input-display-value').textContent = t;
          closeDd();
        });
        box.appendChild(c);
      });
      const r = lab.getBoundingClientRect();
      d.style.top = (window.scrollY + r.bottom) + 'px';
      d.style.left = (window.scrollX + r.left) + 'px';
      d.style.display = '';
      owner = lab;
    });
  });
  document.addEventListener('click', () => { closeDd(); closePanel(); });

  // ---- 出生日期面板：年月日三级，类名是 sd-panal-*（官方拼写） ----
  let panel = null;
  const birth = document.getElementById('birth');
  const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
  function closePanel() { if (panel) panel.style.display = 'none'; }
  function renderPanel(state) {
    panel.innerHTML = '<div class="sd-panal-menu-wrapper"></div>';
    const w = panel.firstChild;
    const head = document.createElement('div');
    head.className = 'sd-panal-select-container';
    head.innerHTML = '<div class="sd-basic-selector"><div><span class="sd-Icon-container sd-Icon-icondoubleLeft">«</span></div>'
      + '<div class="sd-basic-selector-content"><span class="sd-basic-selector-year"></span></div>'
      + '<div><span class="sd-Icon-container sd-Icon-icondoubleRight">»</span></div></div>';
    head.querySelector('.sd-basic-selector-year').textContent = state.month ? `${state.year}年${state.month}月` : `${state.year}年`;
    head.querySelector('.sd-Icon-icondoubleLeft').addEventListener('click', (e) => { e.stopPropagation(); state.year--; state.month = 0; renderPanel(state); });
    head.querySelector('.sd-Icon-icondoubleRight').addEventListener('click', (e) => { e.stopPropagation(); state.year++; state.month = 0; renderPanel(state); });
    w.appendChild(head);
    const body = document.createElement('div');
    body.className = 'sd-panal-table-container';
    if (!state.month) {
      let html = '<div class="sd-basic-year-container">';
      for (let r = 0; r < 3; r++) {
        html += '<div class="sd-basic-year-row">';
        for (let c = 0; c < 4; c++) html += `<div class="sd-basic-year-wrapper"><div class="sd-basic-year-item" data-m="${r * 4 + c + 1}">${CN[r * 4 + c]}月</div></div>`;
        html += '</div>';
      }
      body.innerHTML = html + '</div>';
      body.querySelectorAll('.sd-basic-year-item').forEach((it) => it.addEventListener('click', (e) => {
        e.stopPropagation(); state.month = +it.dataset.m; renderPanel(state);
      }));
    } else {
      const n = new Date(state.year, state.month, 0).getDate();
      let html = '<div class="sd-basic-day-container"><div class="sd-basic-day-row" style="flex-wrap:wrap">';
      for (let d = 1; d <= n; d++) html += `<div class="sd-basic-day-cell"><div class="sd-basic-day-item">${d}</div></div>`;
      body.innerHTML = html + '</div></div>';
      body.querySelectorAll('.sd-basic-day-item').forEach((it) => it.addEventListener('click', (e) => {
        e.stopPropagation();
        birth.value = `${state.year}-${String(state.month).padStart(2, '0')}-${String(it.textContent).padStart(2, '0')}`;
        closePanel();
      }));
    }
    w.appendChild(body);
  }
  birth.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!panel) {
      panel = document.createElement('div');
      panel.className = 'sd-Dropdown-dropdown';
      document.body.appendChild(panel);
    }
    renderPanel({ year: 1990, month: 0 });
    const r = birth.getBoundingClientRect();
    panel.style.top = (window.scrollY + r.bottom) + 'px';
    panel.style.left = (window.scrollX + r.left) + 'px';
    panel.style.display = '';
  });
  document.addEventListener('mousedown', (e) => { if (panel && !panel.contains(e.target) && e.target !== birth) closePanel(); });

  window.__formValues = () => {
    const sels = (key) => [...document.querySelectorAll(`[data-key="${key}"] .sd-Input-display-value`)].map((s) => s.textContent);
    const out = {};
    document.querySelectorAll('input[data-key]').forEach((i) => { out[i.dataset.key] = i.value; });
    const g = sels('grad'); out.grad = g.length === 2 && g[0] && g[1] ? `${g[0]}-${String(parseInt(g[1], 10)).padStart(2, '0')}` : g.join('|');
    const p = sels('period');
    const ym = (y, m) => `${y}-${String(parseInt(m, 10)).padStart(2, '0')}`;
    out.period = p.length === 4 && p.every(Boolean) ? `${ym(p[0], p[1])}~${ym(p[2], p[3])}` : p.join('|');
    out.__submitted = !!window.__submitted;
    return out;
  };
  document.getElementById('submit').addEventListener('click', () => { window.__submitted = true; });
</script>
</body>
</html>
